<mat-card>
    <h2>Schedule Interviews</h2>
    <mat-form-field appearance="fill">
      <mat-label>Select Candidate</mat-label>
      <mat-select [(value)]="selectedCandidate">
        <mat-option *ngFor="let candidate of candidates" [value]="candidate">
          {{ candidate.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  
    <mat-form-field appearance="fill">
      <mat-label>Pick a Date</mat-label>
      <input matInput [matDatepicker]="picker" [(ngModel)]="selectedDate">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  
    <button mat-raised-button color="primary" (click)="scheduleInterview()">Schedule</button>
  </mat-card>
